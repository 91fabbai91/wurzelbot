[project]
name = "wurzelbot"
version = "0.1.0"
description = "Automate your account in Wurzelimperium"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Fabian Baier", email = "fabian.baier@gmx.de" }
]
dependencies = [
    "httplib2>=0.22.0",
    "lxml>=4.9.3",
    "pyyaml>=6.0.1",
    "pydantic>=2.2.1",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.3",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1",
    "ruff>=0.9.0",
    "pre-commit>=3.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
pythonpath = [
    "wurzelbot",
]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["wurzelbot", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint rules
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "E501",    # Line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["wurzelbot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
