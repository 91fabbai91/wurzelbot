[project]
name = "wurzelbot"
version = "0.1.0"
description = "Automate your account in Wurzelimperium"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Fabian Baier", email = "fabian.baier@gmx.de" }
]
dependencies = [
    "lxml>=6.1.3",
    "pyyaml>=6.0.3",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pydantic-settings>=2.16.1",
    "httpx2>=2.16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.3",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
filterwarnings = [
    'ignore:directory "/run/secrets.*" does not exist:UserWarning',
]
pythonpath = [
    "wurzelbot",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["wurzelbot", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PL",  # pylint rules
]
ignore = [
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "E501",    # Line too long (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["wurzelbot"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
